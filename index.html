<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShiftIn</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1e3a5f"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--sf:#fff;--tx:#12131a;--mu:#7a7f91;--ln:#e8eaf2;--ac:#24507f;--ac2:#1f9d8f;--nv:#1e3a5f;--ok:#16a34a;--wn:#d97706;--er:#e11d48;--bl:#2563eb;--sh:0 8px 30px rgba(30,32,70,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e14;--ac:#3d7fc4;--ac2:#2bb5a4;--nv:#e6eefb;--sf:#171923;--tx:#eef0f7;--mu:#8b90a3;--ln:#262938;--ok:#4ade80;--wn:#fbbf24;--er:#fb7185;--bl:#60a5fa;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e14;--ac:#3d7fc4;--ac2:#2bb5a4;--nv:#e6eefb;--sf:#171923;--tx:#eef0f7;--mu:#8b90a3;--ln:#262938;--ok:#4ade80;--wn:#fbbf24;--er:#fb7185;--bl:#60a5fa;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:18px 16px 100px}#app.w{max-width:980px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:9px;margin:2px 0 14px}.mk{height:34px;width:auto;border-radius:10px;background:#fff;display:block}.mk.big{height:84px;border-radius:20px;margin-bottom:14px}
.wm{font-family:"Exo 2","Exo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px}.wm b{color:var(--nv)}.wm i{font-style:normal;color:#1f9d8f}
div.seg button{font-size:12.5px;padding:10px 2px}
.av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700}
.hi{flex:1;min-width:0}.hi small{color:var(--mu);display:block}.hi b{font-size:17px}
.ib{border:0;background:var(--sf);color:var(--tx);width:38px;height:38px;border-radius:12px;box-shadow:var(--sh);cursor:pointer;font-size:16px}
.clock{text-align:center;margin:22px 0}.clock .t{font-size:56px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.d0,.mu{color:var(--mu)}.c{text-align:center;padding:30px}
.card{background:var(--sf);border-radius:22px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--sf);border-radius:18px;padding:13px;box-shadow:var(--sh)}
.tile small,.cell small{color:var(--mu);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.cell b{font-size:24px;font-variant-numeric:tabular-nums}
.s{color:var(--mu);font-size:11px;display:block;margin-top:2px}
.th{width:44px;height:44px;border-radius:11px;object-fit:cover;display:block;cursor:pointer;margin-top:8px}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 10px 24px rgba(31,157,143,.3)}
.btn.dk{background:var(--tx);color:var(--bg);box-shadow:none}.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px;box-shadow:none}
.btn.ln{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}.btn.no{background:var(--er)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.chip,.bd{display:inline-block;padding:6px 11px;border-radius:99px;background:var(--bg);color:var(--mu);font-size:12.5px;margin:0 6px 6px 0}
.bd{font-weight:600;margin:0}.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.bl{color:var(--bl)}
.bd.ok,.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}.bd.wn{background:color-mix(in srgb,var(--wn) 15%,transparent)}.bd.er{background:color-mix(in srgb,var(--er) 14%,transparent)}.bd.bl{background:color-mix(in srgb,var(--bl) 14%,transparent)}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);z-index:5}
nav .in{max-width:480px;margin:0 auto;display:flex;gap:6px}
nav button,.seg button{flex:1;border:0;background:none;color:var(--mu);padding:11px 6px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer}
nav button.on,.seg button.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.dot{background:var(--er);color:#fff;border-radius:99px;padding:1px 6px;font-size:11px;margin-left:4px}
.row .btn.sm{padding:8px 10px;font-size:12px}.row{flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:4px;margin:14px 0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal i{font-style:normal;font-size:13px;padding:8px 0;border-radius:10px;font-variant-numeric:tabular-nums}
.cal .ch{color:var(--mu);font-size:11px;padding:0}.cal .d{background:var(--bg)}.cal .w{color:var(--mu);opacity:.5}
.cal .h{background:color-mix(in srgb,var(--ok) 20%,transparent)}.cal .t{background:color-mix(in srgb,var(--wn) 24%,transparent)}.cal .i{background:color-mix(in srgb,var(--bl) 20%,transparent)}.cal .a{background:color-mix(in srgb,var(--er) 20%,transparent)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row .g{flex:1;min-width:0}
.row .g b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .th{margin:0;flex:none}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.det{display:flex;gap:22px;padding:2px 0 12px}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:8px 10px;font-weight:600}.tb td{padding:11px 10px;text-align:right;border-top:1px solid var(--ln)}
.tb th:first-child,.tb td:first-child{text-align:left;position:sticky;left:0;background:var(--sf)}
input,select{width:100%;padding:13px 14px;margin:0 0 10px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--ac)}label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-1px}h3{margin:0 0 6px;font-size:15px}
.demo{background:color-mix(in srgb,var(--wn) 14%,transparent);color:var(--wn);padding:9px 12px;border-radius:12px;font-size:13px;margin:10px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:480px;background:var(--sf);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:17px}
.x{border:0;background:var(--bg);color:var(--tx);width:34px;height:34px;border-radius:10px;cursor:pointer}
.cam{aspect-ratio:3/4;max-height:42vh;margin:0 auto 14px;border-radius:20px;overflow:hidden;background:#000;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.ph{color:#cbd0e0;text-align:center;padding:16px;font-size:14px}
.sheet a,.ph a{color:var(--ac);cursor:pointer;text-decoration:underline}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.meta small{color:var(--mu);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em}.meta b{font-size:15px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;z-index:60}
.big{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:70}.big img{max-width:92%;max-height:86%;border-radius:16px}
</style>
</head>

const ovt=r=>{if(!r||!r.out)return 0;const m=mod(r.out.t)-mins(cfg.pulang);return m>=cfg.mot?m:0};
const work=r=>r&&r.in&&r.out?Math.round((new Date(r.out.t)-new Date(r.in.t))/6e4):0;
const dist=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),h=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const onLeave=(u,k)=>REQ.some(r=>r.u===u&&DEC[r.id]==='ok'&&r.a<=k&&k<=r.b);
const dstat=(u,k)=>{const r=(DAYS[u]||{})[k],w=new Date(k+'T00:00:00').getDay();if(r&&r.in)return isLate(r)?'t':'h';if(w===0||w===6)return 'w';if(onLeave(u,k))return 'i';return k<kd(new Date())?'a':''};
function stats(u){const s={h:0,t:0,i:0,a:0,o:0,w:0},dim=new Date(ym.y,ym.m+1,0).getDate();for(let i=1;i<=dim;i++){const k=ym.y+'-'+p(ym.m+1)+'-'+p(i),x=dstat(u,k);if(x==='h'||x==='t')s.h++;if(x==='t')s.t++;if(x==='i')s.i++;if(x==='a')s.a++;const r=(DAYS[u]||{})[k];if(r){s.o+=ovt(r);s.w+=work(r)}}return s}
const nm=u=>{const e=E.find(x=>x.id===u);return e?e.name:'—'};
const greet=()=>{const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
const mlabel=()=>new Date(ym.y,ym.m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const fdate=k=>new Date(k+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});

function cap(type){
 let stream=null,pos=null,img=null,okLoc=false,iv;
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="sheet"><div class="hd"><b>${type==='in'?'Absen Masuk':'Absen Pulang'}</b><button class="x" data-x aria-label="Tutup">✕</button></div><div class="cam"><video playsinline muted autoplay></video><div class="ph" hidden>Kamera tidak tersedia.<br><a onclick="this.nextElementSibling.click()">Pilih foto</a><input type="file" accept="image/*" capture="user" hidden></div></div><div class="meta"><div><small>Waktu</small><b class="ct">--:--:--</b></div><div><small>Lokasi</small><b class="loc">Mencari…</b></div></div><button class="btn go" disabled>Ambil foto &amp; absen</button></div>`;
 document.body.appendChild(ov);
 const q=s=>ov.querySelector(s),go=q('.go'),vid=q('video');
 const upd=()=>{go.disabled=!(okLoc&&(stream||img))};
 const close=()=>{clearInterval(iv);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove()};
 const show=()=>{let s=`akurasi ±${pos.acc} m`;okLoc=true;if(cfg.lat!=null){const d=Math.round(dist(pos.lat,pos.lng,+cfg.lat,+cfg.lng));okLoc=d<=cfg.rad;s=okLoc?`dalam area · ${d} m dari kantor`:`<span class="er">di luar area · ${d>=1000?(d/1000).toFixed(1)+' km':d+' m'} dari kantor</span>`}q('.loc').innerHTML=pos.lat.toFixed(5)+', '+pos.lng.toFixed(5)+`<span class="s">${s}</span>`;upd()};
 const fail=()=>{q('.loc').innerHTML='Tidak tersedia<span class="s"><a data-r>Coba lagi</a>'+(DB?'':' · <a data-d>Lokasi demo</a>')+'</span>'};
 const loc=()=>{q('.loc').textContent='Mencari…';if(!navigator.geolocation)return fail();navigator.geolocation.getCurrentPosition(g=>{pos={lat:g.coords.latitude,lng:g.coords.longitude,acc:Math.round(g.coords.accuracy)};show()},fail,{enableHighAccuracy:true,timeout:12000,maximumAge:0})};
 const noCam=()=>{q('.ph').hidden=false;vid.hidden=true};
 ov.onclick=e=>{const t=e.target;if(t===ov||t.hasAttribute('data-x'))close();else if(t.hasAttribute('data-r'))loc();else if(t.hasAttribute('data-d')){pos=cfg.lat!=null?{lat:+cfg.lat,lng:+cfg.lng,acc:0}:{lat:-6.2088,lng:106.8456,acc:0};show()}};
 iv=setInterval(()=>{q('.ct').textContent=hms(new Date())},500);
 if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(s=>{stream=s;vid.srcObject=s;upd()}).catch(noCam);else noCam();
 q('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;q('.ph').innerHTML='Foto dipilih ✓';upd()};i.src=URL.createObjectURL(f)};
 loc();
 go.onclick=async()=>{
  go.disabled=true;
  const t=new Date(),W=240,src=img||vid,sw=img?img.width:vid.videoWidth,sh=img?img.height:vid.videoHeight,H=Math.round(W*sh/sw),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  if(!img){x.translate(W,0);x.scale(-1,1)}
  x.drawImage(src,0,0,W,H);x.setTransform(1,0,0,1,0,0);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,H-28,W,28);x.fillStyle='#fff';x.font='10px sans-serif';
  x.fillText(t.toLocaleDateString('id-ID')+' '+hms(t),8,H-16);x.fillText(pos.lat.toFixed(5)+', '+pos.lng.toFixed(5),8,H-5);
  const k=kd(t),rec={...(TODAY||{})};rec[type]={t:t.toISOString(),lat:pos.lat,lng:pos.lng,acc:pos.acc,photo:c.toDataURL('image/jpeg',.6)};
  try{await D.set('att/'+me.id+'/days/'+k,rec);close();toast(type==='in'?'Absen masuk tercatat':'Absen pulang tercatat');load()}catch(e){toast(e.message||'Gagal menyimpan absen');go.disabled=false}
 };
}

 ws.mergeCells('A1:I1');const t1=ws.getCell('A1');t1.value='ShiftIn  ·  Rekap Absensi Karyawan';t1.font={size:17,bold:true,color:{argb:'FFFFFFFF'}};t1.fill=fill(NV);t1.alignment={vertical:'middle',indent:1};ws.getRow(1).height=38;
 ws.mergeCells('A2:I2');const t2=ws.getCell('A2');t2.value='Periode '+mlabel()+'   ·   Jam kerja '+cfg.masuk+'–'+cfg.pulang+' (toleransi '+cfg.grace+' mnt)   ·   Dicetak '+new Date().toLocaleString('id-ID');t2.font={italic:true,color:{argb:'FF64748B'}};t2.alignment={indent:1};
 ws.getRow(4).values=['No','Nama','Divisi','Hadir (hari)','Terlambat','Izin/Cuti','Alpa','Lembur (jam)','Jam kerja (jam)'];head(ws.getRow(4));
 E.forEach((e,i)=>{const s=stats(e.id),r=ws.addRow([i+1,e.name,e.div||'',s.h,s.t,s.i,s.a,+(s.o/60).toFixed(2),+(s.w/60).toFixed(2)]);
  r.eachCell((c,k)=>{c.border={top:bd,bottom:bd};if(i%2)c.fill=fill('FFF3F7FA');c.alignment={horizontal:k>3?'center':'left',vertical:'middle'};if(k>7)c.numFmt='0.0'});
  if(s.t)r.getCell(5).font={bold:true,color:{argb:'FFB45309'}};if(s.a)r.getCell(7).font={bold:true,color:{argb:'FFE11D48'}}});
 const cnt=E.length,tr=ws.addRow(['','TOTAL','',...'DEFGHI'.split('').map(c=>({formula:'SUM('+c+'5:'+c+(4+cnt)+')'}))]);
 tr.eachCell((c,k)=>{c.font={bold:true,color:{argb:NV}};c.fill=fill('FFD9F0ED');c.alignment={horizontal:k>3?'center':'left'};c.border={top:{style:'medium',color:{argb:TL}}};if(k>7)c.numFmt='0.0'});
 ws.autoFilter='A4:I4';
 const w=W.addWorksheet('Detail Harian',{views:[{state:'frozen',ySplit:1}]});
 w.columns=[{header:'Tanggal',width:14},{header:'Nama',width:26},{header:'Divisi',width:18},{header:'Masuk',width:9},{header:'Pulang',width:9},{header:'Status',width:14},{header:'Lembur (jam)',width:13},{header:'Jam kerja (jam)',width:15},{header:'Peta masuk',width:13},{header:'Peta pulang',width:13}];head(w.getRow(1));
 const L=[];E.forEach(e=>Object.keys(DAYS[e.id]||{}).forEach(k=>{const r=DAYS[e.id][k];if(r.in)L.push({k,e,r})}));
 L.sort((a,b)=>a.k.localeCompare(b.k)||a.e.name.localeCompare(b.e.name));
 const mp=x=>x?{text:'Buka peta',hyperlink:'https://www.google.com/maps?q='+x.lat+','+x.lng}:'';
 L.forEach((z,i)=>{const r=z.r,row=w.addRow([dv(z.k),z.e.name,z.e.div||'',hm(r.in.t),r.out?hm(r.out.t):'',isLate(r)?'Terlambat':'Tepat waktu',+(ovt(r)/60).toFixed(2),+(work(r)/60).toFixed(2),mp(r.in),mp(r.out)]);
  row.eachCell((c,k)=>{c.border={top:bd,bottom:bd};if(i%2)c.fill=fill('FFF3F7FA');if(k>3)c.alignment={horizontal:'center'};if(k>8)c.font={color:{argb:'FF2563EB'},underline:true}});
  row.getCell(1).numFmt='dd mmm yyyy';row.getCell(7).numFmt='0.0';row.getCell(8).numFmt='0.0';if(isLate(r))row.getCell(6).font={bold:true,color:{argb:'FFB45309'}}});
 w.autoFilter='A1:J1';
 try{await DL.save({filename:'ShiftIn-Rekap-'+ym.y+'-'+p(ym.m+1)+'.xlsx',data:await W.xlsx.writeBuffer()})}catch(e){toast('Unduhan dibatalkan')}
}
document.addEventListener('click',async e=>{
 if(e.target.classList&&e.target.classList.contains('th')&&e.target.src){big(e.target.src);return}
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,g=id=>$('#'+id).value;
 try{
 if(a==='tab'){tab=v;load()}
 else if(a==='sub'){sub=v;render()}
 else if(a==='cap')cap(v);
 else if(a==='refresh')load();
 else if(a==='mo'){ym.m+=+v;if(ym.m<0){ym.m=11;ym.y--}if(ym.m>11){ym.m=0;ym.y++}load()}
 else if(a==='theme'){const c=document.documentElement,dk=c.dataset.theme?c.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;c.dataset.theme=dk?'light':'dark'}
 else if(a==='onb'){const n=g('on').trim();if(!n)return toast(me.admin?'Nama wajib diisi':'Masukkan kode undangan');
  if(me.admin)emp={name:n,div:g('od').trim(),at:new Date().toISOString()};
  else{const z=(await D.list('staff')).find(x=>x.code===n.toUpperCase());if(!z)return toast('Kode tidak valid');if(z.active===false)return toast('Akun dinonaktifkan');emp={name:z.name,div:z.div||'',nip:z.nip||'',code:z.code,at:new Date().toISOString()}}
  await D.set('emp/'+me.id,emp);load()}
 else if(a==='sendreq'){const x=g('ra'),y=g('rb');if(!x||!y||y<x)return toast('Periksa tanggal pengajuan');await D.set('req/'+me.id+'/items/'+rid(),{t:g('rt'),a:x,b:y,n:g('rn').trim(),at:new Date().toISOString()});toast('Pengajuan terkirim');load()}
 else if(a==='dec'){await D.set('dec/'+t.dataset.id,{s:v,by:me.id,at:new Date().toISOString()});toast(v==='ok'?'Disetujui':'Ditolak');load()}
 else if(a==='here'){navigator.geolocation.getCurrentPosition(r=>{$('#c5').value=r.coords.latitude.toFixed(6);$('#c6').value=r.coords.longitude.toFixed(6)},()=>toast('Lokasi tidak tersedia'),{enableHighAccuracy:true,timeout:12000})}
 else if(a==='savecfg'){const la=g('c5').trim(),lo=g('c6').trim();cfg={masuk:g('c1')||defs.masuk,pulang:g('c2')||defs.pulang,grace:+g('c3')||0,mot:+g('c4')||0,rad:+g('c7')||200,lat:la&&lo?+la:null,lng:la&&lo?+lo:null};await D.set('cfg/office',cfg);toast('Pengaturan disimpan')}
 else if(a==='addst'){await API('POST','/api/users',{name:g('s1').trim(),username:g('s4'),password:g('s5'),div:g('s2').trim(),nip:g('s3').trim(),role:g('s6')});toast('Akun dibuat');load()}
 else if(a==='togst'){const z=ST.find(x=>x.id===t.dataset.id);await API('PATCH','/api/users/'+z.id,{active:!z.active});load()}
 else if(a==='rst'){const w=prompt('Password baru (min. 8 karakter):');if(w){await API('PATCH','/api/users/'+t.dataset.id,{password:w});toast('Password direset')}}
 else if(a==='pw'){const o=prompt('Password lama:');if(!o)return;const n=prompt('Password baru (min. 8 karakter):');if(!n)return;await API('POST','/api/me/password',{old:o,new:n});toast('Password diganti')}
 else if(a==='logout'){await API('POST','/api/logout');location.reload()}
 else if(a==='login'){const el=$('#le');if(el)el.textContent='';try{me=await API('POST','/api/login',{username:g('lu').trim(),password:g('lp')});authed=true;await init()}catch(err){if(el)el.textContent=err.message}}
 else if(a==='csv'){if(window.ExcelJS){await xlsx();return}const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',rows=[['Nama','Divisi','Hadir','Terlambat','Izin','Alpa','Lembur (menit)','Jam kerja (menit)'].map(q).join(',')];E.forEach(x=>{const s=stats(x.id);rows.push([x.name,x.div,s.h,s.t,s.i,s.a,s.o,s.w].map(q).join(','))});await DL.save({filename:'rekap-'+ym.y+'-'+p(ym.m+1)+'.csv',data:rows.join('\n')}).catch(()=>toast('Unduhan dibatalkan'))}
 }catch(err){toast(err&&err.message||'Terjadi kesalahan, coba lagi')}
});

setInterval(()=>{if(ready&&me.admin&&tab==='adm'&&sub==='dash'&&!busy&&!$('.ov'))load()},60000);
async function init(){try{cfg={...defs,...(await D.get('cfg/office')||{})}}catch(e){}emp=me;ready=true;load()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lp'){const b=$('[data-a=login]');if(b)b.click()}});
(async()=>{render();try{me=await API('GET','/api/me');authed=true;await init()}catch(e){}ready=true;render()})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
